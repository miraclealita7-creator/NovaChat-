<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Chat</title>

    <link rel="stylesheet" href="Nova.css">

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">

            <h1>🤖 Nova Chat</h1>

            <p>Your friendly AI assistant 💜</p>

        </div>

        <div id="chat"></div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
            >

            <button>Send</button>

        </div>

    </div>

    <script src="Nova.js"></script>

</body>
</html>
